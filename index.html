const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function dayNum(f) { const [y, m, d] = f.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
function fromDayNum(n) { const d = new Date(n * 86400000); return d.toISOString().slice(0, 10); }

function nowMin() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 60000); }

function ddmm(f) { return f.slice(8, 10) + '/' + f.slice(5, 7); }
function diaSem(f) { return DIAS[new Date(dayNum(f) * 86400000).getUTCDay()]; }
const NOMBRE_G = { '24h': 'guardia de 24 h', 'D': 'guardia diurna', 'N': 'guardia nocturna' };
function descG(g) { return NOMBRE_G[g.franja] + ' del ' + diaSem(g.fecha) + ' ' + ddmm(g.fecha); }

function err(m) { throw new Error(m); }
function ofertaAbiertaDe(D, gid) { return D.ofertas.find(o => o.guardia_id === gid && o.estado === 'abierta'); }
function descartarPropuestasCon(D, gids) {
  D.propuestas.forEach(p => { if (p.estado === 'pendiente' && gids.includes(p.guardia_id)) p.estado = 'descartada'; });
}
function cerrarOfertasDe(D, gids, estado) {
  D.ofertas.forEach(o => {
    if (o.estado === 'abierta' && gids.includes(o.guardia_id)) {
      o.estado = estado || 'cancelada'; o.resuelta = new Date().toISOString();
      D.propuestas.forEach(p => { if (p.oferta_id === o.id && p.estado === 'pendiente') p.estado = 'descartada'; });
    }
  });
}

const core = {
  publicar(D, me, gid, tipo, nota) {
    const g = D.guardias.find(x => x.id === gid) || err('La guardia no existe.');
    if (g.titular !== me.nombre) err('Esta guardia no es tuya.');
    if (haEmpezado(g)) err('La guardia ya ha empezado o ha pasado.');
    if (ofertaAbiertaDe(D, gid)) err('Ya está publicada en el tablón.');
    if (!['cesion', 'cambio'].includes(tipo)) err('Tipo de oferta no válido.');
    D.ofertas.push({ id: ++D.seq, guardia_id: gid, ofertante: me.nombre, tipo, nota: (nota || '').trim().slice(0, 300), estado: 'abierta', aceptante: null, creada: new Date().toISOString(), resuelta: null });
    hist(D, me.nombre, (tipo === 'cesion' ? 'Ofrece ceder su ' : 'Ofrece cambiar su ') + descG(g));
  },
  cancelar(D, me, oid) {
    const o = D.ofertas.find(x => x.id === oid) || err('La oferta no existe.');
    if (o.estado !== 'abierta') err('La oferta ya está cerrada.');
    if (o.ofertante !== me.nombre && me.rol !== 'admin') err('Solo quien la publicó puede retirarla.');
    const g = D.guardias.find(x => x.id === o.guardia_id);
    cerrarOfertasDe(D, [o.guardia_id], 'cancelada');
    hist(D, me.nombre, 'Retira del tablón la ' + descG(g));
  },
  aceptarCesion(D, me, oid) {
    const o = D.ofertas.find(x => x.id === oid) || err('La oferta no existe.');
    if (o.estado !== 'abierta') err('Otra persona se ha adelantado: la oferta ya está cerrada.');
    if (o.tipo !== 'cesion') err('Esta oferta es un cambio: tienes que proponer una guardia tuya.');
    const g = D.guardias.find(x => x.id === o.guardia_id);
    if (g.titular !== o.ofertante) err('La guardia ya no pertenece a quien la ofertó.');
    if (o.ofertante === me.nombre) err('No puedes aceptar tu propia oferta.');
    if (me.categoria !== g.categoria) err('Solo puede cubrirla alguien de la misma categoría.');
    if (haEmpezado(g)) err('La guardia ya ha empezado.');
    const c = conflicto(D, me.nombre, g);
    if (c) err('Se solapa con tu ' + descG(c) + '.');
    g.titular = me.nombre;
    o.estado = 'aceptada'; o.aceptante = me.nombre; o.resuelta = new Date().toISOString();
    descartarPropuestasCon(D, [g.id]);
    hist(D, me.nombre, 'Se queda la ' + descG(g) + ' de ' + o.ofertante);
  },
  proponer(D, me, oid, gid) {
    const o = D.ofertas.find(x => x.id === oid) || err('La oferta no existe.');
    if (o.estado !== 'abierta' || o.tipo !== 'cambio') err('La oferta ya no admite propuestas.');
    if (o.ofertante === me.nombre) err('No puedes proponerte un cambio a ti mismo.');
    const mia = D.guardias.find(x => x.id === gid) || err('La guardia no existe.');
    const suya = D.guardias.find(x => x.id === o.guardia_id);
    if (mia.titular !== me.nombre) err('Esa guardia no es tuya.');
    if (mia.categoria !== suya.categoria) err('El cambio tiene que ser entre la misma categoría.');
    if (haEmpezado(mia) || haEmpezado(suya)) err('Una de las guardias ya ha empezado.');
    if (D.propuestas.some(p => p.oferta_id === oid && p.guardia_id === gid && p.estado === 'pendiente')) err('Ya has propuesto esa guardia.');
    const c1 = conflicto(D, me.nombre, suya, [mia.id]); if (c1) err('Su guardia se solapa con tu ' + descG(c1) + '.');
    const c2 = conflicto(D, o.ofertante, mia, [suya.id]); if (c2) err('Tu guardia se solapa con otra de ' + o.ofertante + '.');
    D.propuestas.push({ id: ++D.seq, oferta_id: oid, proponente: me.nombre, guardia_id: gid, estado: 'pendiente', creada: new Date().toISOString() });
    hist(D, me.nombre, 'Propone a ' + o.ofertante + ' su ' + descG(mia) + ' por la ' + descG(suya));
  },
  retirar(D, me, pid) {
    const p = D.propuestas.find(x => x.id === pid) || err('La propuesta no existe.');
    if (p.proponente !== me.nombre) err('Solo puedes retirar tus propuestas.');
    if (p.estado !== 'pendiente') err('La propuesta ya no está pendiente.');
    p.estado = 'retirada';
  },
  aceptarPropuesta(D, me, pid) {
    const p = D.propuestas.find(x => x.id === pid) || err('La propuesta no existe.');
    if (p.estado !== 'pendiente') err('La propuesta ya no está pendiente.');
    const o = D.ofertas.find(x => x.id === p.oferta_id);
    if (o.ofertante !== me.nombre) err('Solo quien publicó la oferta puede aceptar propuestas.');
    if (o.estado !== 'abierta') err('La oferta ya está cerrada.');
    const g1 = D.guardias.find(x => x.id === o.guardia_id), g2 = D.guardias.find(x => x.id === p.guardia_id);
    if (g1.titular !== o.ofertante || g2.titular !== p.proponente) err('Alguna de las guardias ha cambiado de titular. Recarga.');
    if (haEmpezado(g1) || haEmpezado(g2)) err('Una de las guardias ya ha empezado.');
    if (conflicto(D, o.ofertante, g2, [g1.id])) err('Esa guardia se solapa con otra tuya.');
    if (conflicto(D, p.proponente, g1, [g2.id])) err('Tu guardia se solapa con otra de ' + p.proponente + '.');
    g1.titular = p.proponente; g2.titular = o.ofertante;
    o.estado = 'aceptada'; o.aceptante = p.proponente; o.resuelta = new Date().toISOString();
    p.estado = 'aceptada';
    D.propuestas.forEach(x => { if (x.oferta_id === o.id && x.estado === 'pendiente') x.estado = 'descartada'; });
    cerrarOfertasDe(D, [g2.id], 'cancelada');
    descartarPropuestasCon(D, [g1.id, g2.id]);
    hist(D, me.nombre, 'Cambio cerrado: ' + o.ofertante + ' hace la ' + descG(g2) + ' y ' + p.proponente + ' la ' + descG(g1));
  },
  importar(D, me, cat, desde, hasta, filas) {
    if (me.rol !== 'admin') err('Solo un administrador puede importar el cuadrante.');
    const fuera = D.guardias.filter(g => g.categoria === cat && g.fecha >= desde && g.fecha <= hasta).map(g => g.id);
    cerrarOfertasDe(D, fuera, 'cancelada');
    D.propuestas = D.propuestas.filter(p => !fuera.includes(p.guardia_id));
    D.guardias = D.guardias.filter(g => !fuera.includes(g.id));
    filas.forEach(f => D.guardias.push({ id: ++D.seq, fecha: f.fecha, franja: f.franja, categoria: cat, titular: f.titular || null }));
    hist(D, me.nombre, 'Importa el cuadrante ' + (cat === 'ENF' ? 'de enfermería' : 'de TES') + ' del ' + ddmm(desde) + ' al ' + ddmm(hasta));
  },
  asignar(D, me, gid, nombre) {
    if (me.rol !== 'admin') err('Solo un administrador puede asignar guardias.');
    const g = D.guardias.find(x => x.id === gid) || err('La guardia no existe.');
    const n = (nombre || '').trim() || null;
    if (n) { const c = conflicto(D, n, g); if (c) err(n + ' ya tiene la ' + descG(c) + ' en ese horario.'); }
    cerrarOfertasDe(D, [gid], 'cancelada');
    descartarPropuestasCon(D, [gid]);
    const antes = g.titular;
    g.titular = n;
    hist(D, me.nombre, (n ? 'Asigna la ' + descG(g) + ' a ' + n : 'Deja libre la ' + descG(g)) + (antes ? ' (antes: ' + antes + ')' : ''));
  }
};

/* Importador: filas de celdas (texto pegado desde Excel o leído del .xlsx).
   Regla del cuadrante: si hay nombre en 24 h, las de 12 h no aplican; si hay alguna de 12 h, la 24 h no aplica
   y la otra mitad queda libre; si no hay nadie, el día entero queda libre. */
function parseFecha(v) {
  if (v == null) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return y + '-' + String(+m[2]).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0'); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  return null;
}
function parseCuadrante(rows) {
  const avisos = [];
  let c24 = 2, cD = 3, cN = 4;
  for (const r of rows) {
    const up = r.map(x => String(x || '').toUpperCase());
    const i24 = up.findIndex(x => x.includes('24')), iD = up.findIndex(x => x.includes('DIURN')), iN = up.findIndex(x => x.includes('NOCTUR'));
    if (iD >= 0 && iN >= 0) { if (i24 >= 0) c24 = i24; cD = iD; cN = iN; break; }
  }
  const filas = [];
  for (const r of rows) {
    const fi = r.findIndex(c => parseFecha(c));
    if (fi < 0 || fi > 1) continue;
    const fecha = parseFecha(r[fi]);
    const n = i => String(r[i] ?? '').trim().replace(/\s+/g, ' ');
    const a = n(c24), d = n(cD), no = n(cN);
    if (a) {
      filas.push({ fecha, franja: '24h', titular: a });
      if (d || no) avisos.push(ddmm(fecha) + ': hay nombre en 24 h y también en 12 h; se usa el de 24 h.');
    } else if (d || no) {
      // Un guion (-) en una celda de 12 h significa «no hay turno», no «libre para externos»
      if (d !== '-') filas.push({ fecha, franja: 'D', titular: d || null });
      if (no !== '-') filas.push({ fecha, franja: 'N', titular: no || null });
    } else {
      filas.push({ fecha, franja: '24h', titular: null });
    }
  }
  const fechas = [...new Set(filas.map(f => f.fecha))].sort();
  return { filas, avisos, desde: fechas[0], hasta: fechas[fechas.length - 1], dias: fechas.length };
}
function rowsFromText(txt) {
  return txt.replace(/\r/g, '').split('\n').filter(l => l.trim()).map(l => l.includes('\t') ? l.split('\t') : l.split(/;|,(?=\S)/));
}

function asegurar(D) { ['avisos', 'incidencias', 'procedimientos', 'contactos'].forEach(k => { if (!Array.isArray(D[k])) D[k] = []; }); return D; }
Object.assign(core, {

/* Resumen de horas de un mes: por persona y categoría */
function resumenHoras(D, mes) {
  const filas = {}, libres = { guardias: 0, horas: 0 };
  D.guardias.filter(g => g.fecha.startsWith(mes)).forEach(g => {
    const h = FR[g.franja].dur;
    if (!g.titular) { libres.guardias++; libres.horas += h; return; }
    const k = g.categoria + '|' + g.titular;
    const f = filas[k] = filas[k] || { nombre: g.titular, categoria: g.categoria, g24: 0, g12: 0, horas: 0 };
    if (g.franja === '24h') f.g24++; else f.g12++;
    f.horas += h;
  });
  return { filas: Object.values(filas).sort((a, b) => a.categoria.localeCompare(b.categoria) || b.horas - a.horas || a.nombre.localeCompare(b.nombre)), libres };
}

/* Calendario (.ics) con las guardias de una persona */
function icsGuardias(gs, nombre) {
  const p2 = n => String(n).padStart(2, '0');
  const loc = (f, h) => { const d = new Date((dayNum(f) * 1440 + h * 60) * 60000); return d.getUTCFullYear() + p2(d.getUTCMonth() + 1) + p2(d.getUTCDate()) + 'T' + p2(d.getUTCHours()) + '0000'; };
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//43.80 SVA-E//Guardias//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Guardias 43.80 SVA-E',
    'BEGIN:VTIMEZONE', 'TZID:Atlantic/Canary',
    'BEGIN:STANDARD', 'DTSTART:19701025T020000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0000', 'TZNAME:WET', 'END:STANDARD',
    'BEGIN:DAYLIGHT', 'DTSTART:19700329T010000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'TZOFFSETFROM:+0000', 'TZOFFSETTO:+0100', 'TZNAME:WEST', 'END:DAYLIGHT',
    'END:VTIMEZONE'];
  gs.forEach(g => {
    const fr = FR[g.franja];
    L.push('BEGIN:VEVENT', 'UID:sva4380-' + g.categoria + '-' + g.fecha + '-' + g.franja + '@guardias4380.github.io', 'DTSTAMP:' + stamp,
      'DTSTART;TZID=Atlantic/Canary:' + loc(g.fecha, fr.ini), 'DTEND;TZID=Atlantic/Canary:' + loc(g.fecha, fr.ini + fr.dur),
      'SUMMARY:Guardia 43.80 · ' + fr.label, 'DESCRIPTION:' + nombre + ' · ' + fr.label + ' (' + fr.horario + ')', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}

/* ================= COLA SIN CONEXIÓN (avisos e incidencias) ================= */
const Cola = {
  db: null,
  async abrir() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('sva4380', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('cola', { keyPath: 'client_id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async tx(modo, fn) { const db = await this.abrir(); return new Promise((res, rej) => { const t = db.transaction('cola', modo); const st = t.objectStore('cola'); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); },
  async todos() { try { return await this.tx('readonly', st => st.getAll()) || []; } catch (e) { return []; } },
  async poner(x) { return this.tx('readwrite', st => st.put(x)); },
  async quitar(id) { return this.tx('readwrite', st => st.delete(id)); },
  enviando: false,
  async enviar() {
    if (DEMO || this.enviando || !Store.session) return;
    this.enviando = true;
    let enviados = 0;
    try {
      for (const x of await this.todos()) {
        try {
          const d = { ...x.datos };
          if (x.foto) d.foto = await Store.subirFoto(x.client_id, x.foto);
          await Store.run(x.kind === 'aviso' ? 'crearAviso' : 'crearIncidencia', d);
          await this.quitar(x.client_id); enviados++;
        } catch (e) {
          if (esRed(e)) break;
          await this.quitar(x.client_id);
          toast('No se pudo enviar un registro pendiente: ' + e.message);
        }
      }
    } finally { this.enviando = false; }
    if (enviados) { toast(enviados === 1 ? 'Enviado 1 registro pendiente' : 'Enviados ' + enviados + ' registros pendientes'); await refrescar().catch(() => {}); render(); }
  }
};

async function comprimirFoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la foto.')); i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), 'image/jpeg', 0.75));
  } finally { URL.revokeObjectURL(url); }
}
const PdfCache = {
  nombre: 'sva4380-pdf',

  async put(id, blob) { try { const c = await caches.open(this.nombre); await c.put(this.key(id), new Response(blob, { headers: { 'Content-Type': 'application/pdf' } })); } catch (e) {} },
  async ids() { try { const c = await caches.open(this.nombre); return (await c.keys()).map(r => r.url.split('pdf-cache/')[1]); } catch (e) { return []; } },
  async del(id) { try { const c = await caches.open(this.nombre); await c.delete(this.key(id)); } catch (e) {} }
};
async function obtenerPdf(p) {

/* ---------- Fichas clínicas (archivos .md del repositorio, disponibles sin conexión) ---------- */
const Fichas = {
  lista: [], textos: {},
  async cargar() {
    try {
      const ri = await fetch('fichas/index.json', { cache: 'no-cache' });
      if (!ri.ok) return;
      const idx = await ri.json();
      const out = [];
      for (const e of idx) {
        try {
          const r = await fetch('fichas/' + e.archivo, { cache: 'no-cache' });
          if (!r.ok) continue;
          const t = await r.text();
          if (/^\s*<!DOCTYPE|^\s*<html/i.test(t)) continue;
          const { meta, cuerpo } = parseFicha(t);
          this.textos[e.id] = cuerpo;
          out.push({ id: e.id, titulo: meta.titulo || e.id, categoria: meta.categoria || 'General', estado: meta.estado || 'borrador', version: meta.version || '', fecha: meta.fecha || '', palabras: meta.palabras || '' });
        } catch (err) { /* sin conexión y sin copia: se omite */ }
      }
      this.lista = out;
    } catch (e) { /* sin índice disponible */ }
  }
};
function parseFicha(t) {
  const meta = {}; let cuerpo = t.replace(/\r/g, '');
  const m = cuerpo.match(/^---\n([\s\S]*?)\n---\n?/);
  if (m) { m[1].split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); }); cuerpo = cuerpo.slice(m[0].length); }
  return { meta, cuerpo };
}
function mdInline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function renderFicha(cuerpo) {
  const L = cuerpo.split('\n'); let h = '', i = 0, abierta = false, nsec = 0;
  const cerrar = () => { if (abierta) { h += '</div></details>'; abierta = false; } };
  while (i < L.length) {
    const l = L[i];
    if (/^## /.test(l)) {
      cerrar(); let t = l.slice(3).trim(); const open = t.startsWith('! '); if (open) t = t.slice(2);
      h += '<details class="fsec' + (open ? ' clave' : '') + '"' + (open ? ' open' : '') + ' id="fs' + (nsec++) + '"><summary>' + mdInline(t) + '</summary><div class="fbody">'; abierta = true; i++; continue;
    }
    if (/^### /.test(l)) { h += '<h4>' + mdInline(l.slice(4)) + '</h4>'; i++; continue; }
    if (/^>[!i] /.test(l)) { h += '<div class="falert ' + (l[1] === '!' ? 'peligro' : 'info') + '">' + mdInline(l.slice(3)) + '</div>'; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < L.length && /^\|/.test(L[i])) { rows.push(L[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(rows[0]), body = rows.slice(rows[1] && /^\|[\s:|-]+\|$/.test(rows[1]) ? 2 : 1);
      const ancha = head.length > 3 || (head.length === 3 && body.some(r => r.length > 90));
      h += '<div class="tablewrap' + (ancha ? ' apilar' : '') + '"><table class="ftab"><thead><tr>' + head.map(c => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>' + body.map(r => '<tr>' + cells(r).map((c, k) => '<td data-l="' + esc(head[k] || '').replace(/\*\*/g, '') + '">' + mdInline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if (/^(\s*)([-*]|\d+\.) /.test(l)) {
      const ord = /^\d+\./.test(l.trim()); let out = '<' + (ord ? 'ol' : 'ul') + '>', sub = false;
      while (i < L.length && /^(\s*)([-*]|\d+\.) /.test(L[i])) {
        const ind = /^\s{2,}/.test(L[i]), txt = L[i].replace(/^\s*([-*]|\d+\.) /, '');
        if (ind && !sub) { out = out.replace(/<\/li>$/, '') + '<ul>'; sub = true; }
        if (!ind && sub) { out += '</ul></li>'; sub = false; }
        out += '<li>' + mdInline(txt) + (ind ? '</li>' : '</li>'); i++;
      }
      if (sub) out += '</ul></li>';
      h += out + '</' + (ord ? 'ol' : 'ul') + '>'; continue;
    }
    if (!l.trim()) { i++; continue; }
    const par = []; while (i < L.length && L[i].trim() && !/^(##|>[!i] |\||\s*([-*]|\d+\.) )/.test(L[i])) { par.push(L[i]); i++; }
    h += '<p>' + mdInline(par.join(' ')) + '</p>';
  }
  cerrar();
  return h;
}
function abrirFicha(id) {
  cerrarVisor();
  const f = Fichas.lista.find(x => x.id === id), t = Fichas.textos[id];
  if (!f || !t) return toast('La ficha no está disponible sin conexión todavía.');

}

/* ================= VISORES ================= */
function cerrarVisor() { const o = $('#visor'); if (o) { if (o.dataset.url) URL.revokeObjectURL(o.dataset.url); o.remove(); } }
function verFoto(path) {
  cerrarVisor();
  const url = S.fotoUrl[path]; if (!url) return;
  document.body.insertAdjacentHTML('beforeend', '<div class="overlay" id="visor" role="dialog" aria-modal="true"><div class="bar"><b>Foto</b><button data-act="cerrarVisor">Cerrar</button></div><div class="body"><img src="' + esc(url) + '" alt="Foto adjunta"></div></div>');
}
async function abrirProc(p) {
  cerrarVisor();
  document.body.insertAdjacentHTML('beforeend', '<div class="overlay" id="visor" role="dialog" aria-modal="true"><div class="bar"><b>' + esc(p.titulo) + '</b><span id="visorExtra"></span><button data-act="cerrarVisor">Cerrar</button></div><div class="body" id="visorBody"><p class="muted">Abriendo…</p></div></div>');
  const body = $('#visorBody');
  try {
    const blob = await obtenerPdf(p);
    const url = URL.createObjectURL(blob);
    const ov = $('#visor'); if (!ov) { URL.revokeObjectURL(url); return; }
    ov.dataset.url = url;
    $('#visorExtra').innerHTML = '<a href="' + url + '" download="' + esc(p.titulo.replace(/[\\/:*?"<>|]/g, '')) + '.pdf">Descargar</a>';
    if (!window.pdfjsLib) await cargarScript('vendor/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    body.innerHTML = '';
    const ancho = Math.min(body.clientWidth - 24, 900), dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let n = 1; n <= pdf.numPages; n++) {
      if (!$('#visor')) return;
      const page = await pdf.getPage(n);
      const v0 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (ancho / v0.width) * dpr * 1.5 });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      body.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
    render();
  } catch (e) {
    body.innerHTML = '<p class="err">' + esc(esRed(e) ? 'Este documento no está guardado en el móvil y no hay conexión. Ábrelo una vez con cobertura o pulsa «Guardar todos».' : (e.message || 'No se pudo abrir el documento.')) + '</p>';
  }
}

    (msg ? '<p class="' + (ok ? 'muted' : 'err') + '">' + esc(msg) + '</p>' : '') +
    '<button class="btn primary block" type="submit">' + (reg ? 'Crear cuenta' : 'Entrar') + '</button></form>' +

    (reg ? '' : '<button class="back" style="align-self:center" data-act="authMode" data-v="olvido">He olvidado mi contraseña</button>') + '</div>';
}
function vPendiente() {

  return '<div class="auth"><h1>Acceso pendiente</h1><p>Tu cuenta' + (p ? ' (<b>' + esc(p.nombre) + '</b>)' : '') + ' está creada. Un administrador tiene que aprobarla antes de que puedas ver el cuadrante.</p>' +

/* ================= RENDER ================= */
function render() {
  const st = $('#status');
  st.innerHTML = S.offline ? '<span class="pill off">Sin conexión</span>' : DEMO ? '<span class="pill">Demo</span>' : '';
  if (S.tab === 'avisos') LS.set('sva4380-visto-avisos', new Date().toISOString());
  $('#main').innerHTML = S.tab === 'cuadrante' ? vCuadrante() : S.tab === 'tablon' ? vTablon() : S.tab === 'avisos' ? vAvisos() : S.tab === 'mas' ? vMas() : vInicio();
  const nav = $('#tabs'); nav.hidden = false;
  const pend = misPropuestasRecibidas().length, nov = S.tab === 'avisos' ? 0 : novedades();
  nav.querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false');
    b.querySelector('.dot')?.remove();
    if (b.dataset.tab === 'tablon' && pend) b.insertAdjacentHTML('beforeend', '<span class="dot">' + pend + '</span>');
    if (b.dataset.tab === 'avisos' && nov) b.insertAdjacentHTML('beforeend', '<span class="dot">' + nov + '</span>');
  });
  renderSheet();
}
function renderSheet() {
  const el = $('#sheet');
  if (!S.sheet) { el.innerHTML = ''; return; }
  const s = S.sheet;
  const f = { guardia: () => sheetGuardia(s.id), proponer: () => sheetProponer(s.id), confirm: () => sheetConfirm(s.texto, s.act, s.id), import: sheetImport, usuarios: sheetUsuarios,
    aviso: sheetNuevoAviso, resolver: () => sheetResolver(s.id), inc: () => sheetNuevaInc(s.id), proc: sheetNuevoProc, contacto: () => sheetContacto(s.id), pass: sheetPass, temp: sheetTempPass }[s.t];
  el.innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + (f ? f() : '') + '</div></div>';
}
function go(tab) { S.tab = tab; S.sub = null; S.sheet = null; render(); window.scrollTo(0, 0); }

async function refrescar() {
  try {
    const D = await Store.load();
    if (D === null) { $('#tabs').hidden = true; $('#main').innerHTML = vPendiente(); return false; }
    S.D = asegurar(D); S.offline = false; S.cacheAt = null;
    const fotos = [...(S.D.avisos || []), ...(S.D.incidencias || [])].map(x => x.foto).filter(Boolean);
    S.fotoUrl = await Store.fotoUrls(fotos).catch(() => ({}));
  } catch (e) {
    const c = LS.get('sva4380-cache');
    if (!DEMO && c) { S.D = asegurar(c.D); S.offline = true; S.cacheAt = c.at; }
    else throw e;
  }
  S.cola = DEMO ? [] : await Cola.todos();
  S.pdfOffline = new Set(await PdfCache.ids());
  if (!Fichas.lista.length || !S.offline) await Fichas.cargar();
  if (!S.mes) S.mes = mesInicial();
  return true;
}
async function accion(fn, args, ok) {
  if (S.offline) { toast('Sin conexión. Inténtalo cuando tengas cobertura.'); return false; }
  try {
    await Store.run(fn, ...args);
    S.sheet = null;
    await refrescar();
    render();
    toast(ok);
    return true;
  } catch (e) {
    toast(esRed(e) ? 'Sin conexión. Inténtalo cuando tengas cobertura.' : (e.message || 'No se pudo completar.'));
    await refrescar().catch(() => {});
    render();
    return false;
  }
}
/* Avisos e incidencias: si no hay red, se guardan en la cola */
async function crearConCola(kind, datos, file) {
  let foto = null;
  try { if (file) foto = await comprimirFoto(file); } catch (e) { toast(e.message); return; }
  if (DEMO) {
    if (foto) datos.foto = await Store.subirFoto(datos.client_id, foto);
    return accion(kind === 'aviso' ? 'crearAviso' : 'crearIncidencia', [datos], kind === 'aviso' ? 'Aviso publicado' : 'Incidencia guardada');
  }
  const encolar = async () => { await Cola.poner({ client_id: datos.client_id, kind, datos, foto, creado: new Date().toISOString() }); S.sheet = null; S.cola = await Cola.todos(); render(); toast('Sin conexión: se enviará solo al recuperar cobertura'); };
  if (S.offline || navigator.onLine === false) return encolar();
  try {
    if (foto) datos.foto = await Store.subirFoto(datos.client_id, foto);
    await Store.run(kind === 'aviso' ? 'crearAviso' : 'crearIncidencia', datos);
    S.sheet = null; await refrescar(); render(); toast(kind === 'aviso' ? 'Aviso publicado' : 'Incidencia guardada');
  } catch (e) {
    if (esRed(e)) return encolar();
    toast(e.message || 'No se pudo guardar.');
  }
}

/* ================= EVENTOS ================= */
document.addEventListener('click', async ev => {
  const tb = ev.target.closest('[data-tab]'); if (tb) return go(tb.dataset.tab);
  const tg = ev.target.closest('[data-tab-go]'); if (tg) return go(tg.dataset.tabGo);
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id ? +b.dataset.id : null;
  if (act === 'scrim') { if (ev.target === b) { S.sheet = null; renderSheet(); } return; }
  switch (act) {
    case 'cerrar': S.sheet = null; return renderSheet();
    case 'cerrarVisor': return cerrarVisor();
    case 'guardia': S.sheet = { t: 'guardia', id }; return renderSheet();
    case 'irTablon': return go('tablon');
    case 'sub': S.sub = b.dataset.v || null; render(); return window.scrollTo(0, 0);
    case 'mes': { let [y, m] = S.mes.split('-').map(Number); m += +b.dataset.d; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.mes = y + '-' + String(m).padStart(2, '0'); return render(); }
    case 'cat': S.cat = b.dataset.v; return render();
    case 'mias': S.soloMias = b.dataset.v === '1'; return render();
    case 'publicar': {
      const tipo = (document.querySelector('input[name=tipo]:checked') || {}).value || 'cesion';
      return accion('publicar', [id, tipo, $('#nota').value], 'Publicada en el tablón');
    }
    case 'cancelar': if (!b.dataset.ok) { S.sheet = { t: 'confirm', texto: '¿Retirar esta guardia del tablón?', act, id }; return renderSheet(); } return accion('cancelar', [id], 'Retirada del tablón');
    case 'quedar': {
      if (!b.dataset.ok) { const o = S.D.ofertas.find(x => x.id === id); S.sheet = { t: 'confirm', texto: '¿Te quedas la ' + descG(G(o.guardia_id)) + ' de ' + o.ofertante + '?', act, id }; return renderSheet(); }
      return accion('aceptarCesion', [id], 'Guardia asignada a tu nombre');
    }
    case 'proponerSheet': S.sheet = { t: 'proponer', id }; return renderSheet();
    case 'proponer': return accion('proponer', [id, +b.dataset.g], 'Propuesta enviada');
    case 'retirar': return accion('retirar', [id], 'Propuesta retirada');
    case 'acepProp': {
      if (!b.dataset.ok) { const p = S.D.propuestas.find(x => x.id === id), o = S.D.ofertas.find(x => x.id === p.oferta_id); S.sheet = { t: 'confirm', texto: '¿Cambiar tu ' + descG(G(o.guardia_id)) + ' por la ' + descG(G(p.guardia_id)) + ' de ' + p.proponente + '?', act, id }; return renderSheet(); }
      return accion('aceptarPropuesta', [id], 'Cambio hecho');
    }
    case 'asignar': return accion('asignar', [id, $('#asigNombre').value], 'Guardia actualizada');
    case 'liberar': return accion('asignar', [id, ''], 'Guardia libre para externos');
    case 'importSheet': S.importPrev = null; S.impErr = null; S.impCat = S.impCat || 'ENF'; S.sheet = { t: 'import' }; return renderSheet();
    case 'impCat': { const t = $('#impTxt')?.value; S.impCat = b.dataset.v; renderSheet(); if (t) $('#impTxt').value = t; return; }
    case 'impPrev': {
      S.impErr = null; S.importPrev = null;
      const txt = $('#impTxt').value, f = $('#impFile').files[0];
      try {
        const rows = f ? await leerXlsx(f) : rowsFromText(txt);
        const p = parseCuadrante(rows);
        if (!p.filas.length) throw new Error('No he encontrado filas con fecha (dd/mm/aaaa). Revisa que has copiado desde la columna FECHA.');
        S.importPrev = p;
      } catch (e) { S.impErr = e.message; }
      renderSheet(); if (txt) $('#impTxt').value = txt; return;
    }
    case 'impOk': { const p = S.importPrev; S.mes = p.desde.slice(0, 7); S.cat = S.impCat; return accion('importar', [S.impCat, p.desde, p.hasta, p.filas], 'Cuadrante importado'); }
    case 'usuariosSheet': S.sheet = { t: 'usuarios' }; return renderSheet();
    case 'guardarUsr': {
      const c = b.closest('[data-uid]');
      return accion('aprobar', [{ p_id: c.dataset.uid, p_nombre: c.querySelector('.u-nombre').value.trim(), p_categoria: c.querySelector('.u-cat').value, p_externo: c.querySelector('.u-ext').checked, p_rol: c.querySelector('.u-rol').value, p_aprobado: b.dataset.ap === '1' }], 'Usuario actualizado');
    }
    case 'tempPass': {
      const c = b.closest('[data-uid]'), u = S.D.usuarios.find(x => String(x.id) === c.dataset.uid);
      if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = 'Pulsa otra vez para confirmar: su contraseña actual dejará de funcionar'; b.classList.add('primary'); return; }
      try { const pw = await Store.tempPass(u.id); S.temp = { nombre: u.nombre, pw }; S.sheet = { t: 'temp' }; renderSheet(); }
      catch (e) { toast(e.message); }
      return;
    }
    case 'copiarTemp': try { await navigator.clipboard.writeText(S.temp.pw); toast('Copiada'); } catch (e) { toast('Mantén pulsada la contraseña para copiarla'); } return;
    case 'resetDemo': if (!b.dataset.ok) { S.sheet = { t: 'confirm', texto: '¿Borrar los cambios y volver al cuadrante original de la demo?', act, id: 0 }; return renderSheet(); } DemoStore.reset(); S.sheet = null; await refrescar(); render(); return toast('Demo reiniciada');
    case 'logout': await Store.sb.auth.signOut(); LS.del('sva4380-cache'); LS.del('sva4380-perfil'); location.reload(); return;
    case 'authMode': S.authMode = b.dataset.v || (S.authMode === 'login' ? 'registro' : 'login'); $('#main').innerHTML = vAuth(); return;
    case 'recargar': return arrancar();
    /* avisos */
    case 'avSeg': S.avisosSeg = b.dataset.v; return render();
    case 'verResueltos': S.verResueltos = !S.verResueltos; return render();
    case 'nuevoAviso': S.avTipo = 'averia'; S.sheet = { t: 'aviso' }; return renderSheet();
    case 'avTipo': { const t = $('#avTexto').value, u = $('#avUrg').checked; S.avTipo = b.dataset.v; renderSheet(); $('#avTexto').value = t; $('#avUrg').checked = u; return; }
    case 'enviarAviso': {
      const texto = $('#avTexto').value.trim(); if (!texto) return toast('Describe el aviso.');
      b.disabled = true;
      return crearConCola('aviso', { client_id: uuid(), tipo: S.avTipo, prioridad: $('#avUrg').checked ? 'urgente' : 'normal', texto }, $('#avFoto').files[0]);

    case 'resolverSheet': S.sheet = { t: 'resolver', id }; return renderSheet();

    case 'reabrir': return accion('reabrirAviso', [id], 'Aviso reabierto');
    case 'borrarAviso': if (!b.dataset.ok) { S.sheet = { t: 'confirm', texto: '¿Borrar este aviso definitivamente?', act, id }; return renderSheet(); } return accion('borrarAviso', [id], 'Aviso borrado');
    case 'nuevaInc': S.sheet = { t: 'inc', id }; return renderSheet();
    case 'enviarInc': {
      const texto = $('#incTexto').value.trim(); if (!texto) return toast('Describe la incidencia.');
      const fecha = $('#incFecha').value; if (!fecha) return toast('Indica la fecha.');
      b.disabled = true;
      return crearConCola('incidencia', { client_id: uuid(), fecha, franja: $('#incFranja').value, texto }, $('#incFoto').files[0]);
    }
    case 'borrarInc': if (!b.dataset.ok) { S.sheet = { t: 'confirm', texto: '¿Borrar esta incidencia?', act, id }; return renderSheet(); } return accion('borrarIncidencia', [id], 'Incidencia borrada');
    case 'verFoto': return verFoto(b.dataset.p);
    /* procedimientos */
    case 'nuevoProc': S.sheet = { t: 'proc' }; return renderSheet();

      const f = $('#procFile').files[0], titulo = $('#procTitulo').value.trim(), cat = $('#procCat').value.trim();
      if (!f) return toast('Elige un archivo PDF.');

      } catch (e) { toast(esRed(e) ? 'Sin conexión.' : e.message); }

      return;

    case 'abrirFicha': return abrirFicha(b.dataset.f);

    case 'guardarTodos': {
      const faltan = (S.D.procedimientos || []).filter(p => !S.pdfOffline.has(String(p.id)));

      for (const p of faltan) { b.textContent = 'Guardando ' + (n + 1) + ' de ' + faltan.length + '…'; b.disabled = true; try { await obtenerPdf(p); n++; } catch (e) { toast('No se pudo guardar «' + p.titulo + '»'); break; } }
      render(); return toast(n + ' documento' + (n === 1 ? '' : 's') + ' guardado' + (n === 1 ? '' : 's') + ' para usar sin conexión');
    }
    /* teléfonos */
    case 'contacto': S.sheet = { t: 'contacto', id: id || null }; return renderSheet();
    case 'guardarContacto': return accion('guardarContacto', [{ id: id || null, nombre: $('#cNombre').value, telefono: $('#cTel').value, nota: $('#cNota').value, orden: $('#cOrden').value }], 'Teléfono guardado');
    case 'borrarContacto': if (!b.dataset.ok) { S.sheet = { t: 'confirm', texto: '¿Borrar este teléfono?', act, id }; return renderSheet(); } return accion('borrarContacto', [id], 'Teléfono borrado');
    /* cuenta y extras */
    case 'passSheet': S.passErr = null; S.sheet = { t: 'pass' }; return renderSheet();
    case 'cambiarPass': {
      const a = $('#pw1').value, c = $('#pw2').value;

      if (S.passErr) return renderSheet();
      try { await Store.cambiarPass(a); S.sheet = null; renderSheet(); toast('Contraseña cambiada'); } catch (e) { S.passErr = e.message; renderSheet(); }
      return;

    case 'ics': {
      const u = me(), gs = S.D.guardias.filter(g => g.titular === u.nombre && rango(g)[1] > nowMin()).sort(sortG);
      if (!gs.length) return toast('No tienes guardias futuras en el cuadrante.');
      descargar('guardias-4380.ics', icsGuardias(gs, u.nombre), 'text/calendar');
      return toast(gs.length + ' guardias exportadas. Ábrelo para añadirlas a tu calendario.');

    case 'horasCsv': {
      const r = resumenHoras(S.D, S.horasMes);
      const csv = ['Categoria;Nombre;Guardias 24h;Guardias 12h;Horas'].concat(r.filas.map(f => [f.categoria, f.nombre, f.g24, f.g12, f.horas].join(';')), ['-;Sin cubrir (externos);;' + r.libres.guardias + ';' + r.libres.horas]).join('\r\n');
      return descargar('horas-4380-' + S.horasMes + '.csv', '﻿' + csv, 'text/csv;charset=utf-8');
    }
  }
});

async function leerXlsx(file) {
  if (/\.csv$/i.test(file.name)) return rowsFromText(await file.text());
  if (!window.XLSX) await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  return rows.map(r => r.map(c => c instanceof Date ? String(c.getDate()).padStart(2, '0') + '/' + String(c.getMonth() + 1).padStart(2, '0') + '/' + c.getFullYear() : c));
}

async function arrancar() {
  try {
    await Store.init();
    if (S.authMode === 'nueva') return;
    if (!DEMO && !Store.session) { $('#tabs').hidden = true; $('#main').innerHTML = vAuth(); return; }
    if (await refrescar()) { render(); Cola.enviar(); }
  } catch (e) {
    $('#main').innerHTML = '<div class="auth"><h1>No se pudo cargar</h1><p class="err">' + esc(e.message || e) + '</p><button class="btn primary block" data-act="recargar">Reintentar</button></div>';
  }
}

}
arrancar();
